[project]
name = "athena-advisor"
version = "0.1.0"
description = "Athena Advisor: picks the specialist team, the lead and whether to ask a clarifying question."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.4",
  "transformers>=4.44",
  "sentence-transformers>=3.1",
  "setfit>=1.1",
  "datasets>=2.21",
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "pyyaml>=6.0",
  "beautifulsoup4>=4.12",
  "matplotlib>=3.9",
  "onnx>=1.16",
  "onnxruntime>=1.19",
  "optimum>=1.22",
  "tokenizers>=0.19",
  "tqdm>=4.66",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/athena_advisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
