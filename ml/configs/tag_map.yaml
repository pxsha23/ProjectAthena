# Stack Overflow tag -> Athena specialist.
#
# This table is the ONLY source of labels: a question's team is the set of specialists its human-written
# tags map to. Tags are never given to the model as input. The table is fixed and published with the
# papers; changing it changes every label, so its SHA-256 is stored with every processed dataset.
#
# generic: true marks broad tags (a whole language, runtime or database engine) that say little about
# what the question is about. Lead selection counts specific tags first and only falls back to generic
# ones when a question has nothing more specific.
#
# Ties for the lead are broken by this order: the narrower, more actionable specialist wins over the
# broader one (a dependency error is a checker job even when it happens in Python code).
priority: [checker, deploy, eva, blueprint, code]

